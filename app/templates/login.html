{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="login_card">
        <h2>Login</h2>
        <form method = "POST" action = "{{ url_for('login') }}">
            {{ form.hidden_tag() }}

            <!-- <div class="form-group">
                <label for="role">Login As</label>
                <select id="role" name="role" onchange="toggleAccessCode()">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="mentor">Mentor</option>
                    <option value="admin">Admin</option>
                </select>
            </div> -->

            <div class="form-group">
                <label>{{ form.email.label }}</label>
                {{ form.email(class = 'form-control') }}
            </div>

            <div class="form-group">
                <label>{{ form.password.label }}</label>
                {{ form.password(class = 'form-control') }}
            </div>

            <button type="submit" class="btn">Login</button>
        </form>
        <p><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
        <p>Need an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
        <p><a href="{{ url_for('about') }}">Learn more about the tracker</a>.</p>
    </div>
    
</div>

{% endblock %}
