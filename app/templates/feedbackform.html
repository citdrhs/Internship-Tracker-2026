{% extends 'base.html' %}
{% block title %}Submit Feedback{% endblock %}
{% block content %}
<h1>Submit Student Feedback</h1>
<div class="action-btns" style="justify-content: center">
    <a href="{{ url_for('feedbackPage') }}" class="btn-edit">Back to feedback list</a>
    <a href="{{ url_for('home') }}" class="btn-secondary">Return home</a>
</div>
<div class="container">
    <div class="card card--wide">

        <form method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="student">Student Name</label>
                    <select name="student" id="student" required>
                        <option value="" disabled selected>Select a student...</option>
                        {% for s in students %}
                        <option value="{{ s[0] }}">{{ s[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="week">Week Number</label>
                    <select name="week" id="week" required>
                        <option value="" disabled selected>Select week</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="other">Add extra week…</option>
                    </select>
                    <input type="number" id="week_custom" min="16" max="52" placeholder="Enter week number" style="display: none">
                </div>

                <div class="form-group form-span-2">
                    <label for="description">Qualitative feedback for the student</label>
                    <textarea class="textarea-lg" name="description" id="description" placeholder="Write your feedback here..." required></textarea>
                </div>

                <div class="form-group form-span-2">
                    <label for="action_items">Action items for students to take</label>
                    <textarea name="action_items" id="action_items" placeholder="Example: Add docstrings to all public functions; write 3 unit tests for the parsing module; refactor the login route into smaller helpers."></textarea>
                </div>

                <div class="form-group form-span-2">
                    <label for="focus_areas">Areas for the student focus on</label>
                    <textarea name="focus_areas" id="focus_areas" placeholder="Example: Commenting on code must be done more thoroughly; commit messages should explain the why; break down large PRs into smaller chunks."></textarea>
                </div>

                <div class="form-group form-span-2">
                    <div class="ratings-legend">
                        <strong>Ratings</strong>
                        <span><strong>5</strong> &ndash; Excellent</span>
                        <span><strong>4</strong> &ndash; Good</span>
                        <span><strong>3</strong> &ndash; Average</span>
                        <span><strong>2</strong> &ndash; Below Average</span>
                        <span><strong>1</strong> &ndash; Unacceptable</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="Quality_of_Work">Quality of Work</label>
                    <input type="range" name="Quality_of_Work" id="Quality_of_Work" min="1" max="5" value="3"
                           oninput="document.getElementById('qualityDisplay').textContent = this.value">
                    <div class="range-labels"><span>1</span><span id="qualityDisplay">3</span><span>5</span></div>
                </div>

                <div class="form-group">
                    <label for="Professionalism">Professionalism</label>
                    <input type="range" name="Professionalism" id="Professionalism" min="1" max="5" value="3"
                           oninput="document.getElementById('professionalismDisplay').textContent = this.value">
                    <div class="range-labels"><span>1</span><span id="professionalismDisplay">3</span><span>5</span></div>
                </div>

                <div class="form-group">
                    <label for="Timeliness_of_Work">Timeliness of Work</label>
                    <input type="range" name="Timeliness_of_Work" id="Timeliness_of_Work" min="1" max="5" value="3"
                           oninput="document.getElementById('timelinessDisplay').textContent = this.value">
                    <div class="range-labels"><span>1</span><span id="timelinessDisplay">3</span><span>5</span></div>
                </div>

                <div class="form-group">
                    <label for="Initiative">Initiative</label>
                    <input type="range" name="Initiative" id="Initiative" min="1" max="5" value="3"
                           oninput="document.getElementById('initiativeDisplay').textContent = this.value">
                    <div class="range-labels"><span>1</span><span id="initiativeDisplay">3</span><span>5</span></div>
                </div>

                <div class="form-group">
                    <label for="Soft_Skills">Soft Skills</label>
                    <input type="range" name="Soft_Skills" id="Soft_Skills" min="1" max="5" value="3"
                           oninput="document.getElementById('softSkillsDisplay').textContent = this.value">
                    <div class="range-labels"><span>1</span><span id="softSkillsDisplay">3</span><span>5</span></div>
                </div>

                <div class="form-group">
                    <label>Overall Rating (auto-calculated from the five scores)</label>
                    <div class="rating-badge"><span id="overallDisplay">3</span><span>/5</span></div>
                </div>

                <div class="form-group form-span-2 btn-row">
                    <button type="submit" class="btn-submit">Submit Feedback</button>
                    <a href="{{ url_for('feedbackPage') }}" class="cancel-link">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
