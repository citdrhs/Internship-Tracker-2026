{% extends 'base.html' %}

{% block title %}Edit Admin Profile{% endblock %}

{% block content %}
<div class="container edit-container">
    <header class="edit-header">
        <h1>Edit Admin Profile</h1>
    </header>


    <form method="POST" action="{{ url_for('editAdmin', id=admin.id) }}" class="admin-edit-form">
        <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ admin.email }}" required>
        </div>
        <div class="form-row">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" value="{{ admin.first_name }}" required>
        </div>
        <div class="form-row">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" value="{{ admin.last_name }}" required>
        </div>
        <div class="form-actions">
            <button type="submit">Save Changes</button>
            <a class="btn-secondary" href="{{ url_for('admin', admin_id=admin.id) }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
