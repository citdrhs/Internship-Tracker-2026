<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mentor Response</title>
</head>

<body style="font-family: Arial, sans-serif; color: #222222; line-height: 1.5;">
    <h2>Your mentor responded to your worklog</h2>
    <p>Hi {{ student_name }}, your mentor left a response on your worklog for {{ day_worked }}:</p>
    <p style="color: #444444;"> → {{ response }}</p>
    <p>Log in to the Internship Tracker to see it on your worklog.</p>
    <p>
        <a href="{{ url_for('login', _external=True) }}"
            style="display: inline-block; background-color: rgb(22, 4, 77); color: #ffffff; padding: 12px 22px; border-radius: 8px; text-decoration: none; font-weight: bold;">Open
            Internship Tracker</a>
    </p>
</body>

</html>
