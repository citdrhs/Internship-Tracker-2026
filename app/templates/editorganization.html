{% extends 'base.html' %}
{% block title %}Edit Organization{% endblock %}
{% block content %}
<h1>Edit Organization</h1>
<div class="container">
    <div class="card">

        <form method="post">
            {% set organization_name = organization[1] %}
            {% include '_organization_form_fields.html' %}

            <div class="form-group btn-row">
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{{ url_for('admin') }}" class="cancel-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
